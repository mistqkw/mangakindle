name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"   # иначе консоль Windows спотыкается о кириллицу

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Поставить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true


      - name: Системные библиотеки для Qt
        if: runner.os == 'Linux'
        run: |
          # на раннере живут чужие репозитории, и их сбои не должны ронять тесты
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*msprod*
          sudo apt-get update -qq || sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Зависимости
        run: uv sync --group dev

      - name: Тесты
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --group dev pytest -q
