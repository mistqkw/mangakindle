name: Релиз

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"   # иначе консоль Windows спотыкается о кириллицу

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Поставить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true


      - name: Системные библиотеки для Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Зависимости
        run: uv sync --group dev

      - name: Тесты перед сборкой
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --group dev pytest -q

      - name: Иконки
        run: uv run python assets/make_icon.py

      - name: Собрать консольную версию
        run: >
          uv run pyinstaller --onefile --clean --noconfirm
          --name mangakindle
          --paths src
          --console
          packaging/cli_entry.py

      - name: Собрать окно (Linux)
        if: matrix.platform == 'linux'
        run: >
          uv run pyinstaller --onefile --clean --noconfirm
          --name mangakindle-gui
          --paths src
          --windowed
          --add-data "assets/icons:assets/icons"
          packaging/gui_entry.py

      - name: Собрать окно (Windows)
        if: matrix.platform == 'windows'
        run: >
          uv run pyinstaller --onefile --clean --noconfirm
          --name mangakindle-gui
          --paths src
          --windowed
          --icon assets/icons/mangakindle.ico
          --add-data "assets/icons;assets/icons"
          packaging/gui_entry.py

      - name: Упаковать (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p package
          cp dist/mangakindle dist/mangakindle-gui package/
          cp README.md package/
          cp assets/mangakindle.desktop package/
          cp assets/icons/mangakindle-256.png package/
          tar -czf mangakindle-linux-x86_64.tar.gz -C package .

      - name: Упаковать (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/mangakindle.exe, dist/mangakindle-gui.exe, README.md -Destination package
          Compress-Archive -Path package/* -DestinationPath mangakindle-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mangakindle-${{ matrix.platform }}
          path: |
            mangakindle-linux-x86_64.tar.gz
            mangakindle-windows-x86_64.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Личный конвертер манги под Kindle 11th gen.

            - `mangakindle` — командная строка
            - `mangakindle-gui` — окно

            Только для личного чтения. Раздачей файлов не занимаемся.
