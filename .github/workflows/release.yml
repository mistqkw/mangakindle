name: Релиз

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"   # иначе консоль Windows спотыкается о кириллицу

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Поставить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true


      - name: Системные библиотеки для Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Зависимости
        run: uv sync --group dev

      - name: Тесты перед сборкой
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --group dev pytest -q

      - name: Иконки
        run: uv run python assets/make_icon.py

      - name: Собрать консольную версию
        run: >
          uv run pyinstaller --onefile --clean --noconfirm
          --name y0mu
          --paths src
          --console
          packaging/cli_entry.py

      - name: Собрать окно (Linux)
        if: matrix.platform == 'linux'
        run: >
          uv run pyinstaller --onefile --clean --noconfirm
          --name y0mu-gui
          --paths src
          --windowed
          --add-data "assets/icons:assets/icons"
          packaging/gui_entry.py

      - name: Собрать окно (Windows)
        if: matrix.platform == 'windows'
        run: >
          uv run pyinstaller --onefile --clean --noconfirm
          --name y0mu-gui
          --paths src
          --windowed
          --icon assets/icons/y0mu.ico
          --add-data "assets/icons;assets/icons"
          packaging/gui_entry.py

      - name: Упаковать (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p package
          cp dist/y0mu dist/y0mu-gui package/
          cp README.md package/
          cp assets/y0mu.desktop package/
          cp assets/icons/y0mu-256.png package/
          tar -czf y0mu-linux-x86_64.tar.gz -C package .

      - name: Упаковать (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/y0mu.exe, dist/y0mu-gui.exe, README.md -Destination package
          Compress-Archive -Path package/* -DestinationPath y0mu-windows-x86_64.zip

      - name: Выложить в релиз
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            y0mu-linux-x86_64.tar.gz
            y0mu-windows-x86_64.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            Личный конвертер манги под Kindle 11th gen.

            - `y0mu` — командная строка
            - `y0mu-gui` — окно

            Только для личного чтения. Раздачей файлов не занимаемся.
