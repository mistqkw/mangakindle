[project]
name = "mangakindle"
version = "0.1.0"
description = "Конвертер манги с mangalib.me под Kindle 11th gen"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.27",
    "pillow>=10.3",
    "keyring>=25.0",
]

[project.scripts]
mangakindle = "mangakindle.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mangakindle"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
